<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 760" role="img" aria-labelledby="title desc">
<title id="title">Noble student learning with a laptop</title><desc id="desc">A friendly stylized 3D-inspired student sitting in a chair with a laptop on a pale blue background.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5e2ff"/><stop offset="1" stop-color="#bed2ff"/></linearGradient>
