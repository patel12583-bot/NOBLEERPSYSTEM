 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6c7a5"/><stop offset="1" stop-color="#d9906f"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
