name: Royal Cricket Club checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/royal-cricket-club-foundation]

concurrency:
  group: royal-cricket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/royal_cricket_ci?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Build Next.js app
        run: npm run build
